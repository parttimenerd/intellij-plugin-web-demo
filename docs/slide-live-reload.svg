<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680"
     font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0,12 4.5,0 9" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0,12 4.5,0 9" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0,12 4.5,0 9" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00000018"/>
    </filter>
  </defs>

  <rect width="1600" height="680" fill="#fafafa"/>

  <!-- Title -->
  <text x="800" y="50" text-anchor="middle" font-size="32" font-weight="700" fill="#111827">Live Reload Flow</text>
  <text x="800" y="82" text-anchor="middle" font-size="18" fill="#6b7280">Double debounce coalesces rapid PSI events into one update</text>

  <!-- ── Box row (y=160, height=160) ───────────────────────────── -->

  <!-- 1. IDE Editor -->
  <rect x="40" y="140" width="200" height="130" rx="12" fill="#fff8f0" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="76" cy="176" r="18" fill="#f59e0b"/>
  <text x="76" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="140" y="200" text-anchor="middle" font-size="18" font-weight="600" fill="#92400e">IDE Editor</text>
  <text x="140" y="226" text-anchor="middle" font-size="15" fill="#78350f">edit Java file</text>
  <text x="140" y="248" text-anchor="middle" font-size="15" fill="#78350f">save</text>

  <!-- Arrow 1→2 -->
  <line x1="242" y1="205" x2="298" y2="205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 2. PSI Event -->
  <rect x="300" y="120" width="220" height="190" rx="12" fill="#fff8f0" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="336" cy="156" r="18" fill="#f59e0b"/>
  <text x="336" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="410" y="184" text-anchor="middle" font-size="18" font-weight="600" fill="#92400e">PSI Event</text>
  <text x="410" y="210" text-anchor="middle" font-size="15" fill="#78350f">childReplaced()</text>
  <text x="410" y="232" text-anchor="middle" font-size="15" fill="#78350f">childAdded()</text>
  <!-- Warning -->
  <rect x="316" y="248" width="188" height="44" rx="7" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="410" y="267" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">⚠ fires 10–20×</text>
  <text x="410" y="284" text-anchor="middle" font-size="14" fill="#92400e">per keystroke</text>

  <!-- Arrow 2→3 -->
  <line x1="522" y1="205" x2="578" y2="205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 3. Debounce 500ms -->
  <rect x="580" y="130" width="200" height="150" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="616" cy="166" r="18" fill="#d97706"/>
  <text x="616" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="680" y="198" text-anchor="middle" font-size="28" font-weight="700" fill="#b45309">500 ms</text>
  <text x="680" y="226" text-anchor="middle" font-size="16" fill="#92400e">server debounce</text>
  <text x="680" y="250" text-anchor="middle" font-size="14" fill="#a16207">Timer / TimerTask</text>
  <text x="680" y="268" text-anchor="middle" font-size="13" fill="#a16207">cancel + reschedule</text>

  <!-- Arrow 3→4 -->
  <line x1="782" y1="205" x2="838" y2="205" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- 4. broadcastReload / WS -->
  <rect x="840" y="130" width="220" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="876" cy="166" r="18" fill="#2563eb"/>
  <text x="876" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
  <text x="950" y="196" text-anchor="middle" font-size="18" font-weight="600" fill="#1d4ed8">WebSocket</text>
  <text x="950" y="222" text-anchor="middle" font-size="15" fill="#1e40af" font-family="ui-monospace,monospace">{"reload":true}</text>
  <text x="950" y="248" text-anchor="middle" font-size="15" fill="#1e40af">broadcast to all</text>
  <text x="950" y="268" text-anchor="middle" font-size="14" fill="#3b82f6">connected clients</text>

  <!-- Arrow 4→5 -->
  <line x1="1062" y1="205" x2="1118" y2="205" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- 5. Debounce 300ms (frontend) -->
  <rect x="1120" y="130" width="200" height="150" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="1156" cy="166" r="18" fill="#d97706"/>
  <text x="1156" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text>
  <text x="1220" y="198" text-anchor="middle" font-size="28" font-weight="700" fill="#b45309">300 ms</text>
  <text x="1220" y="226" text-anchor="middle" font-size="16" fill="#92400e">client debounce</text>
  <text x="1220" y="250" text-anchor="middle" font-size="14" fill="#a16207">App.vue</text>
  <text x="1220" y="268" text-anchor="middle" font-size="13" fill="#a16207">scheduleReload()</text>

  <!-- Arrow 5→6 -->
  <line x1="1322" y1="205" x2="1378" y2="205" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- 6. UI Update -->
  <rect x="1380" y="130" width="200" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="1416" cy="166" r="18" fill="#16a34a"/>
  <text x="1416" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text>
  <text x="1480" y="196" text-anchor="middle" font-size="17" font-weight="600" fill="#166534">UI updates</text>
  <text x="1480" y="222" text-anchor="middle" font-size="15" fill="#15803d">class list</text>
  <text x="1480" y="246" text-anchor="middle" font-size="15" fill="#15803d">+ source pane</text>
  <text x="1480" y="268" text-anchor="middle" font-size="14" fill="#4ade80">re-fetches via HTTP</text>

  <!-- ── IDE / Frontend region labels ──────────────────────── -->
  <rect x="36" y="340" width="768" height="56" rx="10" fill="#fff8f0" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="374" text-anchor="middle" font-size="18" font-weight="600" fill="#92400e">IntelliJ IDE — Java (Javalin server, PsiTreeChangeAdapter, java.util.Timer)</text>

  <rect x="1116" y="340" width="468" height="56" rx="10" fill="#f0f5ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1350" y="374" text-anchor="middle" font-size="18" font-weight="600" fill="#1e3a8a">Web Frontend — Vue 3</text>

  <!-- WS channel label -->
  <rect x="836" y="340" width="276" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="974" y="368" text-anchor="middle" font-size="17" font-weight="600" fill="#1d4ed8">WebSocket</text>
  <text x="974" y="388" text-anchor="middle" font-size="15" fill="#3b82f6">IDE → web push</text>

  <!-- ── Why double debounce ──────────────────────────────── -->
  <rect x="36" y="430" width="1528" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="800" y="462" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Why double debounce?</text>
  <text x="800" y="492" text-anchor="middle" font-size="17" fill="#475569">Typing one character fires 10–20 PSI events · 500ms server-side stops the WS flood · 300ms client-side coalesces late arrivals</text>

  <!-- ── Thread annotations ─────────────────────────────── -->
  <text x="410" y="564" text-anchor="middle" font-size="15" fill="#9ca3af">Timer thread → broadcastReload()</text>
  <text x="410" y="586" text-anchor="middle" font-size="15" fill="#9ca3af">Javalin worker → PsiHelper (runReadAction)</text>
  <text x="1350" y="564" text-anchor="middle" font-size="15" fill="#9ca3af">WS onmessage → scheduleReload() → fetch()</text>

</svg>
