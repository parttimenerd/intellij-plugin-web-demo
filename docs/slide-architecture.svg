<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"
     font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000020"/>
    </filter>
    <marker id="arr-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0,12 4.5,0 9" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0,12 4.5,0 9" fill="#16a34a"/>
    </marker>
    <marker id="arr-gray" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0,12 4.5,0 9" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#111827">Class Browser — Architecture</text>

  <!-- ── LEFT: IntelliJ IDE ──────────────────────────────── -->
  <rect x="60" y="90" width="620" height="760" rx="16" fill="#f7f7f8" stroke="#d1d5db" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#374151">IntelliJ IDE</text>

  <!-- SetFilterAction -->
  <rect x="90" y="152" width="260" height="90" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">SetFilterAction</text>
  <text x="220" y="210" text-anchor="middle" font-size="14" fill="#6b7280">right-click → class at caret</text>
  <text x="220" y="230" text-anchor="middle" font-size="14" fill="#6b7280">→ broadcastFilter()</text>

  <!-- PsiTreeChangeListener -->
  <rect x="380" y="152" width="270" height="90" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="515" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">PSI Listener</text>
  <text x="515" y="210" text-anchor="middle" font-size="14" fill="#6b7280">code changes</text>
  <text x="515" y="230" text-anchor="middle" font-size="14" fill="#6b7280">→ broadcastReload()</text>

  <!-- Arrows down to server -->
  <line x1="220" y1="242" x2="220" y2="282" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="515" y1="242" x2="515" y2="282" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- ClassBrowserServer -->
  <rect x="90" y="282" width="560" height="310" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="318" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">ClassBrowserServer</text>
  <text x="370" y="342" text-anchor="middle" font-size="14" fill="#3b5999">Javalin 6  ·  project service</text>

  <text x="118" y="376" font-size="15" fill="#1e40af" font-family="ui-monospace,monospace">GET  /api/classes</text>
  <text x="118" y="402" font-size="15" fill="#1e40af" font-family="ui-monospace,monospace">GET  /api/source</text>
  <text x="118" y="428" font-size="15" fill="#1e40af" font-family="ui-monospace,monospace">GET  /api/theme</text>
  <text x="118" y="454" font-size="15" fill="#1e40af" font-family="ui-monospace,monospace">POST /api/navigate</text>
  <text x="118" y="480" font-size="15" fill="#2563eb" font-family="ui-monospace,monospace">WS   /ws/filter</text>
  <text x="118" y="506" font-size="15" fill="#6b7280" font-family="ui-monospace,monospace">GET  /  →  classpath:/web/</text>

  <!-- broadcast row -->
  <rect x="110" y="520" width="520" height="40" rx="6" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="370" y="546" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="#1e40af">broadcast()  ·  CopyOnWriteArraySet&lt;WsContext&gt;</text>

  <!-- Arrow to PsiHelper -->
  <line x1="220" y1="592" x2="220" y2="632" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- PsiHelper -->
  <rect x="90" y="632" width="280" height="110" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="230" y="668" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">PsiHelper</text>
  <text x="230" y="694" text-anchor="middle" font-size="14" fill="#6b7280">listClasses()</text>
  <text x="230" y="716" text-anchor="middle" font-size="14" fill="#6b7280">getSourceWithLine()  ·  navigate()</text>

  <!-- BrowserWindow -->
  <rect x="90" y="772" width="560" height="62" rx="10" fill="#f5f0ff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="800" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">BrowserWindow  (JCEF — Java only)</text>
  <text x="370" y="822" text-anchor="middle" font-size="14" fill="#7c3aed">loads http://localhost:{port}/</text>


  <!-- ── RIGHT: Web Frontend ─────────────────────────────── -->
  <rect x="920" y="90" width="620" height="760" rx="16" fill="#f0f5ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="1230" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="#374151">Web Frontend</text>
  <text x="1230" y="158" text-anchor="middle" font-size="14" fill="#6b7280">runs inside BrowserWindow</text>

  <!-- App.vue -->
  <rect x="950" y="172" width="560" height="430" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
  <text x="1230" y="210" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">App.vue</text>
  <text x="1230" y="234" text-anchor="middle" font-size="14" fill="#6b7280">Vue 3 + TypeScript</text>

  <!-- filter input mock -->
  <rect x="976" y="252" width="508" height="50" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="1230" y="283" text-anchor="middle" font-size="15" fill="#6b7280">filter input  ·  v-model  ·  debounced 300 ms</text>

  <!-- class list panel -->
  <rect x="976" y="320" width="230" height="170" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="1091" y="350" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">class list</text>
  <text x="1091" y="378" text-anchor="middle" font-size="14" fill="#2563eb">EventBus</text>
  <rect x="990" y="388" width="78" height="22" rx="4" fill="#e0e7ff"/>
  <text x="1029" y="404" text-anchor="middle" font-size="12" fill="#4338ca" font-family="ui-monospace,monospace">publish()</text>
  <rect x="1076" y="388" width="88" height="22" rx="4" fill="#e0e7ff"/>
  <text x="1120" y="404" text-anchor="middle" font-size="12" fill="#4338ca" font-family="ui-monospace,monospace">subscribe()</text>
  <text x="1091" y="434" text-anchor="middle" font-size="14" fill="#2563eb">Pipeline</text>
  <rect x="990" y="444" width="60" height="22" rx="4" fill="#e0e7ff"/>
  <text x="1020" y="460" text-anchor="middle" font-size="12" fill="#4338ca" font-family="ui-monospace,monospace">map()</text>
  <rect x="1058" y="444" width="70" height="22" rx="4" fill="#e0e7ff"/>
  <text x="1093" y="460" text-anchor="middle" font-size="12" fill="#4338ca" font-family="ui-monospace,monospace">filter()</text>
  <text x="1091" y="480" text-anchor="middle" font-size="12" fill="#9ca3af">method chips</text>

  <!-- source pane panel -->
  <rect x="1224" y="320" width="262" height="170" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="1355" y="350" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">source pane</text>
  <rect x="1244" y="364" width="180" height="10" rx="3" fill="#dbeafe"/>
  <rect x="1244" y="382" width="130" height="10" rx="3" fill="#dcfce7"/>
  <rect x="1244" y="400" width="160" height="10" rx="3" fill="#dbeafe"/>
  <rect x="1244" y="418" width="100" height="10" rx="3" fill="#fef9c3"/>
  <rect x="1244" y="436" width="150" height="10" rx="3" fill="#dbeafe"/>
  <text x="1355" y="476" text-anchor="middle" font-size="13" fill="#9ca3af">shiki  ·  github-light/dark</text>

  <!-- WS handler -->
  <rect x="976" y="510" width="508" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1230" y="537" text-anchor="middle" font-size="16" font-weight="600" fill="#1d4ed8">WebSocket handler</text>
  <text x="1230" y="557" text-anchor="middle" font-size="14" fill="#3b82f6">onmessage → set filter  |  scheduleReload()  ·  reconnect 2s</text>

  <!-- fetch calls -->
  <rect x="976" y="578" width="508" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="1230" y="608" text-anchor="middle" font-size="14" fill="#15803d" font-family="ui-monospace,monospace">fetch /api/classes  ·  /api/source  ·  /api/theme  ·  /api/navigate</text>

  <!-- classBrowser.ts -->
  <rect x="950" y="630" width="560" height="80" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1230" y="663" text-anchor="middle" font-size="18" font-weight="600" fill="#374151">classBrowser.ts</text>
  <text x="1230" y="688" text-anchor="middle" font-size="14" fill="#6b7280">URL builders  ·  WS message parser  ·  17 Vitest tests</text>

  <!-- Vite + shiki -->
  <rect x="950" y="730" width="260" height="80" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1080" y="762" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">Vite build</text>
  <text x="1080" y="786" text-anchor="middle" font-size="14" fill="#6b7280">output → classpath:/web/</text>

  <rect x="1250" y="730" width="260" height="80" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1380" y="762" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">shiki</text>
  <text x="1380" y="786" text-anchor="middle" font-size="14" fill="#6b7280">java only  ·  JS engine</text>


  <!-- ── CENTRE ARROWS ──────────────────────────────────── -->

  <!-- WS push: IDE → web -->
  <path d="M 680 390 C 780 390 820 340 920 340"
        stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arr-blue)"/>
  <rect x="724" y="308" width="172" height="52" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="810" y="330" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">WS  IDE → web</text>
  <text x="810" y="350" text-anchor="middle" font-size="13" fill="#2563eb">{filter} / {reload:true}</text>

  <!-- HTTP: web → IDE -->
  <path d="M 920 440 C 820 440 780 490 680 490"
        stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arr-green)"/>
  <rect x="720" y="412" width="172" height="52" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="806" y="434" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">HTTP  web → IDE</text>
  <text x="806" y="454" text-anchor="middle" font-size="13" fill="#15803d">fetch() calls</text>

  <!-- BrowserWindow loads SPA -->
  <path d="M 680 803 C 780 840 840 810 920 760"
        stroke="#a78bfa" stroke-width="2" stroke-dasharray="8,4" fill="none" marker-end="url(#arr-gray)"/>
  <text x="800" y="858" text-anchor="middle" font-size="13" fill="#7c3aed">loads SPA via http://localhost:{port}/</text>

</svg>
