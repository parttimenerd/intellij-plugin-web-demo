<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"
     font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#374151"/>
    </marker>
    <marker id="arr-ret" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#9ca3af"/>
    </marker>
    <marker id="arr-self" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0,10 4,0 8" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00000018"/>
    </filter>
  </defs>

  <rect width="1600" height="860" fill="#fafafa"/>

  <!-- Title -->
  <text x="800" y="48" text-anchor="middle" font-size="32" font-weight="700" fill="#111827">Request Flow</text>

  <!-- Participant x-centers: User=200, App.vue=600, Server=1050, PsiHelper=1430 -->

  <!-- Participant boxes -->
  <rect x="100" y="76" width="200" height="64" rx="10" fill="#f0f5ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="116" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a5f">User</text>

  <rect x="450" y="76" width="300" height="64" rx="10" fill="#f0f5ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a5f">App.vue</text>
  <text x="600" y="130" text-anchor="middle" font-size="14" fill="#6b7280">Vue 3 · TypeScript</text>

  <rect x="870" y="76" width="360" height="64" rx="10" fill="#e8f0fe" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a5f">ClassBrowserServer</text>
  <text x="1050" y="130" text-anchor="middle" font-size="14" fill="#6b7280">Javalin · project service</text>

  <rect x="1310" y="76" width="240" height="64" rx="10" fill="#f0f5ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="1430" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a5f">PsiHelper</text>
  <text x="1430" y="130" text-anchor="middle" font-size="14" fill="#6b7280">runReadAction</text>

  <!-- Lifelines -->
  <line x1="200"  y1="140" x2="200"  y2="830" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="600"  y1="140" x2="600"  y2="830" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="1050" y1="140" x2="1050" y2="830" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="1430" y1="140" x2="1430" y2="830" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- Section: Filter flow -->
  <rect x="50" y="156" width="1510" height="30" rx="6" fill="#e0e7ff" opacity="0.7"/>
  <text x="70" y="176" font-size="16" font-weight="700" fill="#3730a3">Filter flow</text>

  <!-- 1. User → App.vue: types -->
  <line x1="208" y1="220" x2="590" y2="220" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="395" y="212" text-anchor="middle" font-size="16" fill="#1f2937">types in filter box</text>

  <!-- 2. App.vue self: debounce -->
  <path d="M 610 258 Q 680 258 680 272 Q 680 286 610 286" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-self)"/>
  <text x="700" y="268" font-size="15" fill="#7c3aed">debounce 300 ms</text>

  <!-- 3. App.vue → Server -->
  <line x1="610" y1="330" x2="1038" y2="330" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="820" y="320" text-anchor="middle" font-size="16" fill="#1f2937" font-family="ui-monospace,monospace">GET /api/classes?filter=foo</text>

  <!-- 4. Server → PsiHelper -->
  <line x1="1062" y1="374" x2="1418" y2="374" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1238" y="364" text-anchor="middle" font-size="16" fill="#1f2937">listClasses(project, "foo")</text>

  <!-- 5. PsiHelper self: runReadAction -->
  <path d="M 1442 412 Q 1520 412 1520 426 Q 1520 440 1442 440" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-self)"/>
  <text x="1540" y="422" font-size="15" fill="#7c3aed">runReadAction</text>
  <text x="1540" y="438" font-size="15" fill="#7c3aed">AllClassesSearch</text>

  <!-- 6. PsiHelper → Server: return -->
  <line x1="1418" y1="478" x2="1062" y2="478" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arr-ret)"/>
  <text x="1238" y="468" text-anchor="middle" font-size="15" fill="#9ca3af">List&lt;ClassInfo&gt;</text>

  <!-- 7. Server → App.vue: return -->
  <line x1="1038" y1="520" x2="612" y2="520" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arr-ret)"/>
  <text x="820" y="510" text-anchor="middle" font-size="15" fill="#9ca3af">JSON array</text>

  <!-- 8. App.vue self: render -->
  <path d="M 610 558 Q 680 558 680 572 Q 680 586 610 586" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-self)"/>
  <text x="700" y="568" font-size="15" fill="#7c3aed">render class boxes</text>
  <text x="700" y="584" font-size="15" fill="#7c3aed">+ method chips</text>

  <!-- Section: Source flow -->
  <rect x="50" y="616" width="1510" height="30" rx="6" fill="#fce7f3" opacity="0.7"/>
  <text x="70" y="636" font-size="16" font-weight="700" fill="#9d174d">Source flow — user clicks method chip</text>

  <!-- 9. User → App.vue: click -->
  <line x1="208" y1="680" x2="590" y2="680" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="395" y="672" text-anchor="middle" font-size="16" fill="#1f2937">clicks method chip</text>

  <!-- 10. App.vue → Server -->
  <line x1="610" y1="718" x2="1038" y2="718" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="820" y="708" text-anchor="middle" font-size="16" fill="#1f2937" font-family="ui-monospace,monospace">GET /api/source?fqn=…&amp;method=bar</text>

  <!-- 11. Server → PsiHelper -->
  <line x1="1062" y1="756" x2="1418" y2="756" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1238" y="746" text-anchor="middle" font-size="16" fill="#1f2937">getSourceWithLine()</text>

  <!-- 12. PsiHelper → Server: return -->
  <line x1="1418" y1="790" x2="1062" y2="790" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arr-ret)"/>
  <text x="1238" y="780" text-anchor="middle" font-size="15" fill="#9ca3af">SourceResult(text, line)</text>

  <!-- 13. Server → App.vue: return -->
  <line x1="1038" y1="824" x2="612" y2="824" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arr-ret)"/>
  <text x="820" y="814" text-anchor="middle" font-size="15" fill="#9ca3af">{source, line} → shiki → source pane</text>

  <!-- Legend -->
  <line x1="60" y1="854" x2="110" y2="854" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="120" y="859" font-size="14" fill="#374151">call</text>
  <line x1="180" y1="854" x2="230" y2="854" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arr-ret)"/>
  <text x="240" y="859" font-size="14" fill="#9ca3af">return</text>
  <line x1="310" y1="854" x2="340" y2="854" stroke="#7c3aed" stroke-width="2"/>
  <text x="350" y="859" font-size="14" fill="#7c3aed">self-call</text>

</svg>
