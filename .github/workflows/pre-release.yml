name: Pre-Release (rolling unstable)

# Rebuilds and republishes the "latest" pre-release on every push to main.
# The existing "latest" release (if any) is deleted first so the tag is always
# replaced by a fresh build — matching the pattern from
# https://github.com/parttimenerd/intellij-profiler-plugin.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pre-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Extract plugin version
        id: version
        run: |
          version=$(grep '^pluginVersion' gradle.properties | cut -d'=' -f2 | xargs)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Delete existing "latest" release and tag
        # Ignore errors — the release may not exist on the first run
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          prerelease: true
          name: "Development Build ${{ steps.version.outputs.version }}"
          body: |
            Unstable development build of version **${{ steps.version.outputs.version }}** — rebuilt on every push to `main`.

            Install via **Settings → Plugins → ⚙ → Install Plugin from Disk…**

            Built from commit ${{ github.sha }}.
          files: build/distributions/*.zip
